name: Live API check

# Reads the real Beli API with a throwaway account, once a day, to notice when
# a response changes. Read-only. See MAINTAINING.md for the account and secrets.
#
# Nothing here may print a token or a response body: the live tests run with
# tracebacks and captured output off, login output is discarded, and the
# scripts report shapes and status codes only.

on:
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-api
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    env:
      BELI_EMAIL: ${{ secrets.BELI_CI_EMAIL }}
      BELI_PASSWORD: ${{ secrets.BELI_CI_PASSWORD }}
      BELI_LIVE_INTERVAL: "2"
    steps:
      - uses: actions/checkout@v4

      - name: Check that the CI account is configured
        id: guard
        run: |
          if [ -z "$BELI_EMAIL" ] || [ -z "$BELI_PASSWORD" ]; then
            echo "::notice::BELI_CI_EMAIL and BELI_CI_PASSWORD are not set. Nothing to do."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            mkdir -p "$RUNNER_TEMP/report"
            echo "BELI_SESSION_FILE=$RUNNER_TEMP/beli-session.json" >> "$GITHUB_ENV"
            echo "BELI_LIVE_REPORT=$RUNNER_TEMP/report/tests.md" >> "$GITHUB_ENV"
            echo "SHAPES_REPORT=$RUNNER_TEMP/report/shapes.md" >> "$GITHUB_ENV"
          fi

      - uses: astral-sh/setup-uv@v6
        if: steps.guard.outputs.run == 'true'

      - name: Install
        if: steps.guard.outputs.run == 'true'
        run: uv sync --group dev

      # Saves tokens to $BELI_SESSION_FILE, which the next two steps reuse.
      # Output is discarded: a failed login echoes the server's reply.
      - name: Log in
        id: login
        if: steps.guard.outputs.run == 'true'
        continue-on-error: true
        run: uv run beli --interval "$BELI_LIVE_INTERVAL" login > /dev/null 2>&1

      - name: Live tests
        id: tests
        if: steps.login.outcome == 'success'
        continue-on-error: true
        run: >
          uv run pytest -m live -v --tb=no -rN --show-capture=no
          --disable-warnings -p no:cacheprovider

      - name: Response shapes
        id: shapes
        if: steps.login.outcome == 'success'
        continue-on-error: true
        run: >
          uv run python scripts/snapshot_shapes.py --check
          --interval "$BELI_LIVE_INTERVAL" --report "$SHAPES_REPORT"

      - name: Remove the session
        if: always() && steps.guard.outputs.run == 'true'
        run: rm -f "$BELI_SESSION_FILE"

      - name: Open or update the api-drift issue
        id: issue
        if: >
          steps.guard.outputs.run == 'true' &&
          (steps.login.outcome == 'failure' || steps.tests.outcome == 'failure' ||
          steps.shapes.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          LOGIN: ${{ steps.login.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          SHAPES: ${{ steps.shapes.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="$RUNNER_TEMP/report/issue.md"
          {
            echo "The daily live check failed on $(date -u +%Y-%m-%d) at commit \`${GITHUB_SHA::7}\`. [Workflow run]($RUN_URL)."
            echo
            echo "This report holds field names, JSON types, status codes and paths only."
            echo
            if [ "$LOGIN" = failure ]; then
              echo "## Login"
              echo
              echo "Logging in with the CI account failed, so nothing else ran. Either the"
              echo "account or its secrets need attention, or \`POST /api/token/\` changed."
              echo
            fi
            if [ "$TESTS" = failure ]; then
              echo "## Live tests (\`pytest -m live\`)"
              echo
              cat "$BELI_LIVE_REPORT" 2> /dev/null || echo "Failed without a report. See the run."
              echo
            fi
            if [ "$SHAPES" = failure ]; then
              echo "## Response shapes (\`scripts/snapshot_shapes.py --check\`)"
              echo
              echo "Lines with \`-\` are in \`tests/shapes/\`; lines with \`+\` are what the API sent."
              echo
              cat "$SHAPES_REPORT" 2> /dev/null || echo "Failed without a report. See the run."
            fi
          } > "$body"
          .github/scripts/upsert-issue.sh api-drift "Beli API drift detected" "$body"

      - name: Fail the run
        if: steps.issue.outcome == 'success'
        run: exit 1
